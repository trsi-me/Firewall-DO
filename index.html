<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wireshark">

    <title>Wireshark</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="main-content">
        <section class="home" id="home">
            <div class="home-data"><header><div class="logo"><h1>Wireshark</h1></div></header></div>

            <div class="btns">
                <div class="start-btn-container"><button class="start-btn" id="start-btn"><i class="fa-solid fa-circle-play"></i> راقب الشبكة</button></div>                
                <div class="stop-btn-container"><button class="stop-btn" id="stop-btn"><i class="fa-regular fa-circle-stop"></i> وقف المراقبة</button></div>                
            </div>

            <h2>حركة الشبكة</h2>
        </section>
    </div>

    <footer>
        <p>دانة العتيبي<br>
            جميع الحقوق محفوظة ©2025.
        </p>
    </footer>

    <script src="script.js"></script>    
</body>
</html>
